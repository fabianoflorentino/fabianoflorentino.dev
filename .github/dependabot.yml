# .github/dependabot.yml
version: 2
updates:
  # Maintain Hugo Modules (themes, components)
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    # Optional: Group updates to reduce PR noise
    groups:
      hugo-dependencies:
        patterns:
          - "*"

  # Maintain GitHub Actions workflows (e.g., peaceiris/actions-hugo)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
