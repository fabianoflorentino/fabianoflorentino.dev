services:
  blog:
    container_name: blog
    image: fabianoflorentino/blog:v0.0.1
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HUGO_VERSION: ${HUGO_VERSION:-0.155.3}
    volumes:
      - ./:/blog
    ports:
      - 1313:1313
    tty: true
    stdin_open: true
    healthcheck:
      test: ["CMD-SHELL", "ps | grep -q '[h]ugo' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 3
