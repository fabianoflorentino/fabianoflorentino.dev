  about:
    enable: true
    title: "Sim sou eu!"
    image: /images/me-about.jpg
    content: |-
      Sou profissional de tecnologia há **14 anos**, com experiência em ambientes de alta criticidade e atuação na interseção entre **Site Reliability Engineering (SRE)**, **Engenharia de Software** e **DevOps**.

      Minha trajetória começou com **10 anos** dedicados à administração de sistemas **Linux e Windows**, infraestrutura, orquestração de contêineres, automação de processos, monitoramento e observabilidade. Ao longo desse período, desenvolvi uma visão sólida sobre disponibilidade, resiliência, escalabilidade e confiabilidade de sistemas distribuídos.

      Nos últimos **4 anos**, venho direcionando minha atuação para **Engenharia de Software**, desenvolvendo aplicações e APIs backend utilizando **Ruby on Rails**, **Python** e, mais recentemente, **Go (Golang)**.

      Atualmente, trabalho no desenvolvimento de soluções backend para uma plataforma de serviços e automação em larga escala, habilitando clientes a criar, executar e gerenciar automações envolvendo tecnologias como **Ansible Automation Platform (AAP)**, provedores de nuvem, plataformas de monitoramento e ferramentas de observabilidade.

      Minha atuação combina engenharia de software e excelência operacional, aplicando práticas como **TDD**, **SOLID**, **Clean Code**, arquitetura de software e princípios de **SRE e DevOps**. Tenho especial interesse em automação de operações, redução de toil, observabilidade, gestão de incidentes e melhoria contínua da confiabilidade dos serviços.

      Acredito que SRE vai além de manter sistemas disponíveis. Trata-se de aplicar princípios de engenharia de software aos desafios de operação, construindo sistemas resilientes, escaláveis e sustentáveis, enquanto equilibramos confiabilidade, velocidade de entrega e eficiência operacional.

      Meu objetivo é contribuir para a evolução de plataformas e serviços críticos, aproximando desenvolvimento e operações por meio de automação, engenharia de confiabilidade e soluções orientadas a resultados.

      Colaboração, simplicidade, aprendizado contínuo e foco em impacto são os pilares que orientam minha forma de trabalhar.
