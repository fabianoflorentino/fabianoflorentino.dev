                  **Release automation:** Automated distribution and updates for a PHP/Apache system, including file diff checks, server configuration, and service restarts.

                  **Monitoring & capacity:** Implemented Zabbix with a Puppet module for CPU, memory, and disk metrics, supporting capacity planning and incident response.

                  **Infrastructure availability:** Implemented a VMware vCenter cluster with Windows Server Storage for nearly **200 virtualized services and servers**, improving availability, resilience, and resource utilization.

                  **DevOps culture:** Bridged datacenter and development teams, reducing manual steps, delivery errors, and provisioning time.
