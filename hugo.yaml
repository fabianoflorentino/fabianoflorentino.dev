  about:
    enable: true
    title: "Sim sou eu!"
    image: /images/me.jpeg
    content: |-
      Sou desenvolvedor de software especializado em **Go e Ruby**, com foco na construção de **sistemas distribuídos**, **microserviços** e **APIs REST** para backends corporativos.
      
      Tenho experiência prática criando soluções **escaláveis, resilientes e de alta disponibilidade**, trabalhando com desafios reais de performance, concorrência, observabilidade e 
      confiabilidade em produção.
      
      No dia a dia, utilizo **Go como principal linguagem para serviços distribuídos**, aplicando boas práticas de arquitetura, como **arquitetura hexagonal**, separação de responsabilidades e contratos bem definidos entre serviços.

      Também possuo uma base sólida em **SRE e DevOps**, com experiência em **CI/CD**, automação, monitoramento, cloud computing e containerização com **Docker e Kubernetes**.
      Este blog é um espaço onde compartilho aprendizados, experiências práticas e reflexões sobre **backend, sistemas distribuídos, Go, APIs e arquitetura de software**.

    skills:
      enable: true
      title: "Conhecimento em:"
      items:
        - Go
        - Ruby
        - Linux
        - Shellscript
        - Container
        - Docker
        - Docker-Compose
        - Kubernetes
        - Openshift
        - Grafana
        - Insomnia
        - Postman

  experience:
    enable: true
    title: "Experiência"
    items:
      - company: "Kyndryl"
        companyUrl: "https://www.kyndryl.com/us/en"
        jobs:
          - name: "Engenheiro de Desenvolvimento de Software"
            date: "Julho/2023 - atualmente"
            content: |-
              Desenvolver e manter APIs backend em Ruby on Rails para sistemas distribuídos de alta complexidade. Trabalho com equipes multidisciplinares, para analisar os requisitos do projeto e os desafios técnicos para garantir uma boa compreensão.

              Implementar soluções escaláveis e de alto desempenho que possam sustentar o crescimento contínuo do sistema. Identificar e resolver problemas de desempenho e escalabilidade, onde aplico técnicas avançadas para otimizar o desempenho e melhorar a eficiência.

              Assegurar a segurança e a conformidade das APIs backend. Implemento medidas rigorosas de segurança e trabalho em estreita colaboração com as equipes de segurança cibernética para garantir que nossos sistemas estejam protegidos contra ameaças potenciais.

              Documentação para garantir a manutenibilidade e a escalabilidade de qualquer sistema. Portanto, dedico tempo para documentar cuidadosamente o código, os processos e as decisões de design, garantindo que toda a equipe tenha acesso às informações necessárias para trabalhar de forma eficaz.

              Além de desenvolver software, também desempenho um papel ativo no fornecimento de suporte técnico e orientação para outros membros da equipe. Acredito na importância de compartilhar conhecimento e experiência para promover o crescimento e o desenvolvimento de todos os membros da equipe.
            info:
              content: Trabalhando como Engenheiro de Desenvolvimento de Software (Software Engineering Development)
          - name: |-
              Engenheiro de Confiabilidade do Site
            date: "Dezembro/2018 - Julho/2023"
            content: |-
              Função desempenhada na prestação de serviços performáticos a clientes em componentes de hardware e software.

              As atividades incluem operação e manutenção de sistemas operacionais em várias plataformas, servidores de aplicação, várias tecnologias de banco de dados, soluções de alta disponibilidade e balanceamento de carga.

              As responsabilidades do trabalho para esta função incluem, mas não estão limitadas a: operação e manutenção de sistemas operacionais e suporte de plataforma, administração de banco de dados, planejamento de capacidade, gerenciamento de desempenho, conformidade de segurança.

              O suporte também é fornecido para ferramentas de gerenciamento de sistemas que monitoram o status operacional do ambiente.

              Função desempenhada com base em confiabilidade e resiliência com a combinação certa de conhecimentos e habilidades em software e sistemas, responsáveis por analisar as necessidades de negócios, determinação de problemas, aconselhar e projetar, construir, testar, implantar, alterar e manter uma informação bem projetada sistema e ecossistemas.

              - Automatizar os fluxos de trabalho e a infraestrutura, permitindo que as equipes de produtos e engenharia se movimentem rapidamente, trabalhando em conjunto com as equipes de desenvolvimento e a ciência de dados para implantar novas tecnologias e implementar novas estratégias.
              - Gerenciar provedores de nuvem.
              - Automatizar Infraestrutura, Aplicações e Serviços.
              - Monitoramento e suporte servidores e serviços no local.
              - Garantir alta disponibilidade do ambiente.
            info:
              content: Trabalhando como Engenheiro de Confiabilidade do Site (Site Reliability Engineer)
      - company: "2com Consulting"
        companyUrl: "https://2comconsulting.com.br/"
        jobs:
          - name: "Analista de Monitoramento"
            date: "Junho/2018 - Dezembro/2018"
            info:
              content: Trabalhando como Analista de Monitoramento
            content: |-
              - Responsável por iniciar as práticas da cultura de DevOps entre as equipes.
              - Automação do serviço de monitoramento
              - Centralização de códigos de automação com o Git.
              - Implementação de Ansible, Puppet e ShellScript para auxiliar na implementação de serviços de monitoramento e sensores de alerta.
              - Responsável por buscar metodologias para entrega mais rápida de atividades.
              - Treinar equipes em DevOps, Ansible, Puppet, ShellScript
              - Gerenciamento, manutenção e monitoramento de serviços de banco de dados, ERP e backups de clientes.
              - Suporte ao cliente e equipes internas.

      - company: "Soluti"
        companyUrl: "https://www.soluti.com.br/"
        jobs: 
        - name: "Analista de infraestrutura de TI"
          date: "Dezembro/2014 - Fevereiro/2018"
          content: |-
            - Auxiliar as equipes do Datacenter na implementação de soluções de problemas, garantindo que os sistemas e serviços críticos sejam adequadamente monitorados e com alertas relevantes, devidamente ativos e resolvidos.
            - Desenvolvimento de soluções de arquitetura para novos projetos e alteração de existentes, utilizando ferramentas de gerenciamento de configuração e scripts para implementação e manutenção do sistema.
            - Atender solicitações de suporte em relação à infraestrutura local.
            - Implantação, manutenção e monitoramento de servidores Linux / Apache / MySQL / PHP
            - Gerenciamento de serviços de proxy reverso com o apache2
            - Gerenciamento de serviços de firewall interno do servidor (iptales)
            - Gerenciamento do endurecimento de servidores Linux
            - Implantar, manter e solucionar problemas de clientes digitais que emitem certificados digitais
            - Gerenciamento de automação e configuração de atualizações e manutenção de servidores com Puppet
            - Gerenciamento de automação e configuração de implantação de monitoramento interno com o Zabbix
            - Implantação do Rundeck para gerenciamento de configuração e solução de problemas de serviços internos
            - Implementação, Manutenção e Acompanhamento do sistema antifraude de certificado digital
            - Implementação, Manutenção, Documentação e Monitoramento do sistema de identificação biométrica.

