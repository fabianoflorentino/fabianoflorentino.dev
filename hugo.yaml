      hero:
        intro: "Hello World!"
        subtitle: ""
        content: "Father of Inácio and proud husband of Jullyana! Yes, two L's and a Y :)"
        button:
          name: "Resume"
      about:
        title: "About me!"
        content: |-
          I am a **Backend and Platform Software Engineer** with **14 years of experience**, the last 10 dedicated to DevOps/SRE, distributed systems, and software development. My career evolved from infrastructure administration to building distributed systems in **Go (Golang)**.

          Specialist in designing, building, and maintaining scalable, high-performance microservices for the **Kyndryl Bridge** product, with direct impact on critical global operations. Strong background in **Hexagonal Architecture**, concurrency (goroutines and channels), service contracts, production resilience, observability, and **SRE/DevOps** culture.

          In production, this work translates into **200M+ automation executions** and **16M+ operational insights per month**, with a **30% reduction in impact incidents** and a **35% gain in global operational productivity**.

          Based in **Hortolândia, SP — Brazil**. Languages: **native Portuguese** and **technical English with intermediate reading**.
        skills:
          title: "Skills:"
          items:
            - title: "Backend"
              items:
                - "Go (Golang)"
                - "Concurrency (goroutines/channels)"
                - "Hexagonal Architecture"
                - "REST APIs"
                - "Explicit contracts"
                - "Clean Code"
            - title: "Distributed systems & SRE"
              items:
                - "High availability"
                - "Observability (logs, metrics, tracing)"
                - "Resilience"
                - "Load balancing"
                - "Capacity planning"
            - title: "Automation & cloud"
              items:
                - "Ansible"
                - "Puppet"
                - "Shell Script"
                - "Git"
                - "Linux (hardening)"
                - "Reverse proxy (Apache/Nginx)"
                - "Cloud environments"
            - title: "Critical operations & data"
              items:
                - "Mission-critical production support"
                - "Databases"
                - "Layered security"
                - "Real-time monitoring (Zabbix/Rundeck)"
      experience:
        title: "Experience"
        items:
          - company: "Kyndryl"
            companyUrl: "https://www.kyndryl.com/us/en"
            jobs:
              - name: "Backend Software Engineer (Go)"
                date: "June/2023 - Present"
                content: |-
                  **Core Engine in Go:** Build and collaborative maintenance of the distributed backend services of **Kyndryl Bridge**, a global platform responsible for processing **200M+ automation executions** and **16M+ operational insights per month**.

                  **Architecture & Code Quality:** Continuous application of software architecture, clear service contracts, and decoupling of responsibilities, ensuring high maintainability and reliability.

                  **Direct Operational Impact:** Architecture and concurrency improvements contributed to a **30% reduction in impact incidents** and a **35% gain in global operational productivity**.

                  **Engineering & SRE:** Integration of software engineering best practices, observability, and SRE for system support and predictive capacity.
                info:
                  content: Working as Backend Software Engineer (Go)
              - name: "Site Reliability Engineer (SRE)"
                date: "August/2021 - July/2023"
                content: |-
                  **Sustainment & Reliability:** Management and optimization of high-availability environments, load balancers, databases, and critical applications at enterprise scale.

                  **Platform Operations:** Administration of operating systems, application servers, and database technologies, including capacity planning, performance management, and security compliance.

                  **Automation & Monitoring:** Automation of infrastructure and services, cloud provider management, and continuous monitoring to ensure environment high availability.
                info:
                  content: Working as Site Reliability Engineer (SRE)
          - company: "IBM"
            companyUrl: "https://www.ibm.com/"
            jobs:
              - name: "Site Reliability Engineer (SRE)"
                date: "December/2018 - August/2021"
                content: |-
                  **Infrastructure Automation:** Development of automations to support accelerated product delivery by engineering teams.

                  **Sustainment & Reliability:** Management and optimization of high-availability environments, load balancers, databases, and critical applications at enterprise scale.

                  **Compliance & Resilience:** Continuous monitoring, capacity planning, and application of rigorous security and compliance requirements in multicloud platforms.
                info:
                  content: Working as Site Reliability Engineer (SRE)
          - company: "2com Consulting"
            companyUrl: "https://2comconsulting.com.br/"
            jobs:
              - name: "Monitoring Analyst / DevOps"
                date: "June/2018 - December/2018"
                info:
                  content: Working as Monitoring Analyst / DevOps
                content: |-
                  **DevOps Culture & Enablement:** Leadership in spreading DevOps culture across the team, delivering practical training in Ansible, Puppet, and Shell Scripting.

                  **Automation & Versioning:** Centralization of automation code in Git repositories and creation of custom sensors for preventive alerting of ERP and database services.

                  **Operations:** Management, maintenance, and monitoring of customer database, ERP, and backup services, with support for customers and internal teams.

          - company: "Soluti"
            companyUrl: "https://www.soluti.com.br/"
            jobs:
              - name: "IT Infrastructure & Security Analyst"
                date: "December/2014 - February/2018"
                content: |-
                  **Management & Hardening:** Administration of the Linux ecosystem, web servers (Apache), MySQL, and PHP; environment automation with Puppet and operational task orchestration with Rundeck.

                  **Anti-fraud & Biometrics:** Implementation and technical documentation of critical biometric validation and digital certificate issuance systems.

                  **Infrastructure & Data Center:** Configuration of reverse proxies, firewalls, and monitoring tools (Zabbix), ensuring SLA in mission-critical environments.
