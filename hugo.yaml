    enable: true
    title: "Sim sou eu!"
    image: /images/me-about.jpg
    content: |-
      Profissional de tecnologia com **15 anos de experiência**, incluindo **10 anos** em administração de sistemas Linux e Windows, automação, contêineres, monitoramento e observabilidade. Nos últimos **três anos**, foco em engenharia de software e desenvolvimento backend em **Go, Ruby on Rails e Python**.

      Atua em serviços para plataformas de automação, aplicando boas práticas de desenvolvimento, arquitetura de software e princípios de **SRE e DevOps**. Experiência em ambientes críticos e sistemas distribuídos, em uma plataforma com cerca de **200 milhões de execuções automatizadas mensais** e **60 mil automações e workflows**.

      Os indicadores reportados para o ambiente incluem **16 milhões de eventos operacionais geridos por mês**, **redução de até 30% no impacto operacional** e **aumento de até 35% na produtividade**.

      Baseado em **Hortolândia, SP — Brasil**. Idiomas: **português nativo** e **inglês básico-intermediário (fala, leitura e escrita)**.
