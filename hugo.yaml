      experience:
        title: "Experience"
        items:
          - company: "Kyndryl"
            companyUrl: "https://www.kyndryl.com/"
            jobs:
              - name: "Software Engineer"
                date: "July 2023 – Present · Hortolândia, São Paulo, Brazil"
                content: |-
                  **Go backend at scale:** Develop backend services in Go for automation platforms and critical operations, with concurrency, hexagonal architecture, clear contracts, and a focus on reliability and predictability in production.

                  **Automation platform:** Contributed to a platform with approximately **200 million automated executions per month**, **60,000 automations and workflows**, and **16 million operational events managed monthly**.

                  **Measurable impact:** Contributed to improvements that delivered **up to 30% reduction in operational impact** and **up to 35% productivity improvement**, with data-driven decisions and end-to-end operational thinking.

                  **SRE & DevOps:** An SRE and DevOps background complements engineering work, enabling end-to-end ownership from code to production in distributed, observable, and evolvable systems.
          - company: "IBM"
            companyUrl: "https://www.ibm.com/"
            jobs:
              - name: "Site Reliability Engineer"
                date: "December 2018 – July 2023 · Hortolândia, São Paulo, Brazil"
                content: |-
                  **SRE leadership in a stabilization project:** Led a 7-person cross-functional task force — operations, networking, DBA, application, and account — to restore stability to a healthcare platform serving about **13 million beneficiaries**, under HIPAA and budget constraints.

                  **Root cause and permanent fixes:** Investigated the source of the incidents and eliminated three issues: a legacy process with a memory leak, TCP keepalive configured on the load balancer, and leftover development code that called a non-existent local service, causing **2.4 s** timeouts.

                  **Reliability results:** Reduced error rate from **43.6% to 0.2%** and increased transaction success from **55.45% to 99.5%**, with **2,900 calls per minute** and **181 ms** average response time.

                  **Observability:** Led the AppDynamics PoC and rollout, supported UAT instrumentation, and helped create an SRE dashboard for proactive monitoring, reducing manual log checks.

                  **Proactive monitoring:** Built a containerized Zabbix/Grafana dashboard for AIX, Linux, and Windows environments, expanding coverage to Oracle, SQL Server, DB2, and digital certificate expiration.
          - company: "2Com Consulting"
            companyUrl: "https://2comconsulting.com.br/"
            jobs:
              - name: "Specialist Monitoring Analyst"
                date: "June 2018 – December 2018 · Goiânia, Goiás, Brazil"
                content: |-
                  **Monitoring automation:** Developed Ansible roles and playbooks to deploy the OMD monitoring system across Linux/Oracle and Windows/SQL Server scenarios, reducing delivery time from **days to 30–40 minutes**.

                  **Operational results:** Migrated Shell scripts to GitLab-versioned Ansible roles; reduced the ticket queue by **more than 60%** and **eliminated the monitoring delivery backlog**.

                  **Technical decision & teams:** Evaluated Puppet through a PoC and rejected it because it required an agent, dedicated infrastructure, and stable connectivity; with Ansible, standardized the process and trained teams in DevOps and automation.
          - company: "Soluti Certificação Digital"
            companyUrl: "https://www.soluti.com.br/"
