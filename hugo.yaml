            - "Puppet"
            - "Shell Script"
            - "Git"
            - "Linux (hardening)"
            - "Proxy reverso (Apache/Nginx)"
            - "Ambientes em nuvem"
        - title: "Operações críticas & dados"
          items:
            - "Suporte à produção nível crítico"
            - "Bancos de dados"
            - "Segurança em camadas"
            - "Monitoramento em tempo real (Zabbix/Rundeck)"

  experience:
    enable: true
    title: "Experiência"
    items:
      - company: "Kyndryl"
        companyUrl: "https://www.kyndryl.com/us/en"
        jobs:
          - name: "Engenheiro de Software Backend (Go)"
            date: "Junho/2023 - atualmente"
            content: |-
              **Core Engine em Go:** Construção e manutenção colaborativa dos serviços backend distribuídos do **Kyndryl Bridge**, plataforma global responsável por processar **200M+ execuções de automação** e **16M+ insights operacionais por mês**.

              **Arquitetura & Qualidade de Código:** Aplicação contínua de arquitetura de software, contratos de serviço claros e desacoplamento de responsabilidades, garantindo alta manutenibilidade e confiabilidade.

              **Impacto Operacional Direto:** As melhorias de arquitetura e concorrência contribuíram para a **redução de 30% em incidentes de impacto** e um **ganho de 35% na produtividade operacional global**.

              **Engenharia & SRE:** Integração de boas práticas de engenharia de software, observabilidade e SRE para sustentação e capacidade preditiva do sistema.
            info:
              content: Atuando como Engenheiro de Software Backend (Go)
          - name: "Engenheiro de Confiabilidade de Sites (SRE)"
            date: "Agosto/2021 - Julho/2023"
            content: |-
              **Sustentação & Confiabilidade:** Gestão e otimização de ambientes de alta disponibilidade, balanceadores de carga, bancos de dados e aplicações críticas em escala enterprise.

              **Operação de Plataforma:** Administração de sistemas operacionais, servidores de aplicação e tecnologias de banco de dados, com planejamento de capacidade, gestão de desempenho e conformidade de segurança.

              **Automação & Monitoramento:** Automação de infraestrutura e serviços, gestão de provedores de nuvem e monitoramento contínuo para garantir a alta disponibilidade do ambiente.
            info:
              content: Atuando como Engenheiro de Confiabilidade de Sites (SRE)
      - company: "IBM"
        companyUrl: "https://www.ibm.com/"
        jobs:
          - name: "Engenheiro de Confiabilidade de Sites (SRE)"
            date: "Dezembro/2018 - Agosto/2021"
            content: |-
              **Automação de Infraestrutura:** Desenvolvimento de automações para suportar a entrega acelerada de produtos pelos times de engenharia.

              **Sustentação & Confiabilidade:** Gestão e otimização de ambientes de alta disponibilidade, balanceadores de carga, bancos de dados e aplicações críticas em escala enterprise.

              **Conformidade & Resiliência:** Monitoramento contínuo, planejamento de capacidade e aplicação de rigorosos requisitos de segurança e compliance em plataformas multicloud.
            info:
              content: Atuando como Engenheiro de Confiabilidade de Sites (SRE)
      - company: "2com Consulting"
        companyUrl: "https://2comconsulting.com.br/"
        jobs:
          - name: "Analista de Monitoramento / DevOps"
            date: "Junho/2018 - Dezembro/2018"
            info:
              content: Atuando como Analista de Monitoramento / DevOps
            content: |-
              **Cultura DevOps & Enablement:** Liderança na disseminação da cultura DevOps na equipe, ministrando treinamentos práticos em Ansible, Puppet e Shell Scripting.

              **Automação & Versionamento:** Centralização do código de automação em repositórios Git e criação de sensores customizados para alerta preventivo de serviços de ERP e bancos de dados.

              **Operações:** Gerenciamento, manutenção e monitoramento de serviços de banco de dados, ERP e backups de clientes, com suporte ao cliente e às equipes internas.

      - company: "Soluti"
        companyUrl: "https://www.soluti.com.br/"
        jobs: 
        - name: "Analista de Infraestrutura de TI & Segurança"
          date: "Dezembro/2014 - Fevereiro/2018"
          content: |-
            **Gerenciamento & Hardening:** Administração de ecossistema Linux, servidores web (Apache), MySQL e PHP; automação de ambientes com Puppet e orquestração de tarefas operacionais com Rundeck.

            **Sistemas Antifraude & Biometria:** Implantação e documentação técnica de sistemas críticos de validação biométrica e emissão de certificados digitais.

            **Infraestrutura & Data Center:** Configuração de proxies reversos, firewalls e ferramentas de monitoramento (Zabbix), garantindo SLA em missão crítica.

