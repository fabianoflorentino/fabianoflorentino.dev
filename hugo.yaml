      about:
        title: "Yes, it's me!"
        content: |-
          I'm a technology professional with **14 years of experience**, working in mission-critical environments at the intersection of **Site Reliability Engineering (SRE)**, **Software Engineering**, and **DevOps**.

          My journey began with **10 years** dedicated to **Linux and Windows** systems administration, infrastructure, container orchestration, process automation, monitoring, and observability. During that time, I developed a solid understanding of availability, resilience, scalability, and the reliability of distributed systems.

          Over the last **4 years**, I have been moving toward **Software Engineering**, building backend applications and APIs with **Ruby on Rails**, **Python**, and, more recently, **Go (Golang)**.

          I currently work on backend solutions for a large-scale services and automation platform, enabling customers to create, run, and manage automations involving technologies such as **Ansible Automation Platform (AAP)**, cloud providers, monitoring platforms, and observability tools.

          My work combines software engineering and operational excellence, applying practices such as **TDD**, **SOLID**, **Clean Code**, software architecture, and **SRE and DevOps** principles. I have a special interest in operations automation, toil reduction, observability, incident management, and continuous improvement of service reliability.

          I believe SRE goes beyond keeping systems available. It's about applying software engineering principles to operational challenges, building resilient, scalable, and sustainable systems while balancing reliability, delivery velocity, and operational efficiency.

          My goal is to contribute to the evolution of critical platforms and services, bringing development and operations closer together through automation, reliability engineering, and results-driven solutions.

          Collaboration, simplicity, continuous learning, and a focus on impact are the pillars that guide the way I work.
