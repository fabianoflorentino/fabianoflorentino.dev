                  **High-volume workloads & concurrency:** Work with high-volume workloads, concurrency, and strict availability requirements, contributing to resilient, observable distributed systems that are easy to evolve over time.

                  **Scale & results:** Contribute to a platform with approximately **200 million automated executions per month** and **60,000 automations and workflows**, with **16 million operational events managed monthly**, **up to 30% reduction in operational impact**, and **up to 35% productivity improvement**.

                  **Architecture & evolution:** Participate in architectural decisions and service improvements, applying hexagonal architecture, clear contracts, separation of responsibilities, and data-driven operational thinking.

                  **SRE & DevOps:** Complement engineering work with an SRE and DevOps background, providing an end-to-end view of the system, from code to production.

                  **Objective & impact:** Turn complex problems into simple, sustainable solutions that create measurable impact in efficiency, stability, and delivery.
