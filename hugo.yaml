      about:
        title: "Yes, it's me!"
        content: |-
          Technology professional with **15 years of experience**, including **10 years** in Linux and Windows systems administration, automation, containers, monitoring, and observability. Over the last **three years**, focused on software engineering and backend development with **Go, Ruby on Rails, and Python**.

          Builds services for automation platforms, applying software engineering practices, sound architecture, and **SRE and DevOps** principles. Experienced in mission-critical environments and distributed systems supporting a platform with approximately **200 million automated executions per month** and **60,000 automations and workflows**.

          Reported environment-level indicators include **16 million operational events managed monthly**, **up to 30% reduction in operational impact**, and **up to 35% productivity improvement**.

          Based in **Hortolândia, São Paulo — Brazil**. Languages: **native Portuguese** and **English: basic to intermediate (speaking, reading, and writing)**.
