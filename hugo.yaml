  about:
    enable: true
    title: "Sim sou eu!"
    image: /images/me.jpeg
    content: |-
      Sou **Engenheiro de Software Backend e de Plataforma** com **14 anos de experiência**, sendo os últimos 10 dedicados a DevOps/SRE, sistemas distribuídos e desenvolvimento de software. Minha trajetória evoluiu da administração de infraestrutura para a construção de sistemas distribuídos em **Go (Golang)**.

      Especialista na concepção, construção e manutenção de microserviços escaláveis de alta performance no produto **Kyndryl Bridge**, com impacto direto em operações críticas globais. Sólida atuação em **Arquitetura Hexagonal**, concorrência (goroutines e channels), contratos de serviço, resiliência de produção, observabilidade e cultura **SRE/DevOps**.

      Em produção, esse trabalho se traduz em **200M+ execuções de automação** e **16M+ insights operacionais por mês**, com **redução de 30% em incidentes de impacto** e **ganho de 35% na produtividade operacional global**.

      Baseado em **Hortolândia, SP — Brasil**. Idiomas: **português nativo** e **inglês técnico com leitura intermediária**.
    skills:
      enable: true
      title: "Conhecimento em:"
      items:
        - title: "Backend"
          items:
            - "Go (Golang)"
            - "Concorrência (goroutines/channels)"
            - "Arquitetura Hexagonal"
            - "APIs REST"
            - "Contratos explícitos"
            - "Clean Code"
        - title: "Sistemas distribuídos & SRE"
          items:
            - "Alta disponibilidade"
            - "Observabilidade (logs, métricas, tracing)"
            - "Resiliência"
            - "Balanceamento de carga"
            - "Capacity planning"
        - title: "Automação & cloud"
          items:
