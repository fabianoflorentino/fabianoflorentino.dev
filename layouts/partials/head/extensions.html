{{- with .OutputFormats.Get "RSS" }}
<link rel="alternate" type="{{ .MediaType.Type }}" title="{{ $.Site.Title }}" href="{{ .Permalink }}">
{{- end }}
<link rel="canonical" href="{{ .Permalink }}">
{{- if .IsTranslated }}
{{- $defaultLang := (index site.Languages 0).Lang }}
{{- $xdefault := . }}
{{- range .Translations }}
<link rel="alternate" hreflang="{{ .Language.LanguageCode }}" href="{{ .Permalink }}">{{- if eq .Lang $defaultLang }}{{ $xdefault = . }}{{ end }}
{{- end }}
<link rel="alternate" hreflang="{{ .Language.LanguageCode }}" href="{{ .Permalink }}">
<link rel="alternate" hreflang="x-default" href="{{ $xdefault.Permalink }}">
{{- end }}
