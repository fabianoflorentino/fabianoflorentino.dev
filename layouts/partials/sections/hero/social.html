<span>
    {{ range .Site.Params.hero.socialLinks.fontAwesomeIcons }}
    <span class="px-1">
        <a href="{{ .url }}"
            {{ if not (hasPrefix .url "#") }} target="_blank" {{ end }}
            class="btn social-icon"
        >
            <i class="{{ .icon }}"></i>
        </a>
    </span>
    {{ end }}

    {{ with .Site.GetPage "/posts" }}
    {{ with .OutputFormats.Get "RSS" }}
    <span class="px-1">
        <a href="{{ .Permalink }}" target="_blank" class="btn social-icon" aria-label="RSS">
            <i class="fa-solid fa-rss" aria-hidden="true"></i>
        </a>
    </span>
    {{ end }}
    {{ end }}

    {{ range .Site.Params.hero.socialLinks.customIcons }}
    <span class="px-1">
        <a href="{{ .url }}"
            {{ if not (hasPrefix .url "#") }} target="_blank" {{ end }}
            class="btn social-icon"
        >
            <img src="{{ .icon }}">
        </a>
    </span>
    {{ end }}
</span>
