<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
  <title id="title">Credly by Pearson</title>
  <desc id="desc">Credly digital credentials badge.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#080d18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6bffd6"/>
      <stop offset=".5" stop-color="#31c9ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx=".2" cy=".35" r=".65">
      <stop offset="0" stop-color="#6bffd6" stop-opacity=".16"/>
      <stop offset="1" stop-color="#6bffd6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".92" cy=".1" r=".6">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".16"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="300" fill="url(#bg)"/>
  <rect width="640" height="300" fill="url(#glow)"/>
  <rect width="640" height="300" fill="url(#glow2)"/>

  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <path d="M120 86l50 29v58l-50 29-50-29v-58l50-29z" fill="#0e1a2a" stroke="url(#accent)" stroke-width="3"/>
    <path d="M120 100l38 22v44l-38 22-38-22v-44l38-22z" stroke="url(#accent)" stroke-opacity=".35" stroke-width="1.2" fill="none"/>
    <path d="M100 143l14 14 28-29" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="170" cy="115" r="2.5" fill="#31c9ff"/>
    <circle cx="70" cy="115" r="2.5" fill="#6bffd6"/>
    <circle cx="120" cy="202" r="2.5" fill="#a78bfa"/>

    <text x="212" y="150" fill="#f2f7fb" font-size="46" font-weight="800" letter-spacing="-1.4">Credly</text>
    <text x="214" y="184" fill="#8ea0b8" font-size="15" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="3">BY PEARSON</text>

    <rect x="214" y="204" width="146" height="30" rx="15" fill="#0e1a2a" stroke="#22304a"/>
    <circle cx="232" cy="219" r="3.5" fill="#a78bfa"/>
    <text x="244" y="224" fill="#c9d6e6" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace">DIGITAL BADGES</text>
  </g>
