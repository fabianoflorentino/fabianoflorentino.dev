<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">golang-agent-skills field guide preview</title>
  <desc id="desc">Dark preview with the title A field guide for Go agents, skill counters, install commands, and routing chips.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#080d18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6bffd6"/>
      <stop offset=".5" stop-color="#31c9ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx=".15" cy=".1" r=".8">
      <stop offset="0" stop-color="#31c9ff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#31c9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".9" cy=".05" r=".6">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".16"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>
  <rect width="1200" height="750" fill="url(#glow2)"/>

  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif">
    <text x="56" y="86" fill="#8ea0b8" font-size="16" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="2">FIELD GUIDE</text>
    <text x="56" y="146" fill="#f2f7fb" font-size="46" font-weight="800" letter-spacing="-1.5">A field guide for <tspan fill="#6bffd6">Go</tspan> agents.</text>
    <text x="56" y="182" fill="#8ea0b8" font-size="17">58 skills that help agents write, review, and debug idiomatic Go.</text>

