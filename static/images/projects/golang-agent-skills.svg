      </g>
      <g transform="translate(556, 214)">
        <rect width="96" height="36" rx="18" fill="#0e1522" stroke="#22304a"/>
        <text x="18" y="23" fill="#a78bfa">MIT</text>
      </g>
    </g>

    <g transform="translate(56, 286)">
      <rect width="700" height="386" rx="18" fill="#0e1522" stroke="#22304a"/>
      <g transform="translate(28, 40)">
        <circle cx="0" cy="0" r="5" fill="#ff8098"/>
        <circle cx="18" cy="0" r="5" fill="#ffd166"/>
        <circle cx="36" cy="0" r="5" fill="#6bffd6"/>
        <text x="60" y="1" fill="#7d8ea6" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" dominant-baseline="middle">terminal</text>
      </g>

      <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15">
        <text x="28" y="96" fill="#6bffd6">$ <tspan fill="#c9d6e6">npx skills add</tspan></text>
        <text x="44" y="124" fill="#c9d6e6">https://github.com/fabianoflorentino/</text>
        <text x="44" y="150" fill="#c9d6e6">golang-agent-skills --all</text>

        <text x="28" y="206" fill="#6bffd6">$ <tspan fill="#c9d6e6">npx skills add ... --skill</tspan></text>
        <text x="44" y="234" fill="#8ea0b8">golang-pitfalls-error-handling</text>

