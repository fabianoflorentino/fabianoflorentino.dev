        </g>
        <g transform="translate(28, 246)">
          <rect width="304" height="34" rx="8" fill="#101a2b" stroke="#1b2740"/>
          <text x="14" y="22" fill="#c9d6e6">Project Setup</text>
          <text x="290" y="22" fill="#61718a" text-anchor="end">8</text>
        </g>
        <g transform="translate(28, 290)">
