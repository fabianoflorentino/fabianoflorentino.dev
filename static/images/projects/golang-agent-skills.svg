      <circle cx="24" cy="20" r="4" fill="#6bffd6"/>
      <text x="40" y="25" fill="#c9d6e6" font-size="14" font-family="'JetBrains Mono', ui-monospace, monospace">58 skills · MIT</text>
    </g>

    <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14">
      <g transform="translate(56, 214)">
        <rect width="146" height="36" rx="18" fill="#0e1522" stroke="#22304a"/>
