<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">stckcraw dashboard preview</title>
  <desc id="desc">Dark dashboard with a market index chart and the top ten B3 movers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#080d18"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6bffd6"/>
      <stop offset=".5" stop-color="#31c9ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#31c9ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#31c9ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".15" cy=".1" r=".8">
      <stop offset="0" stop-color="#31c9ff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#31c9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".9" cy=".05" r=".6">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".16"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>
  <rect width="1200" height="750" fill="url(#glow2)"/>

