      <path d="M28 372 L80 350 L132 360 L184 318 L236 330 L288 286 L340 300 L392 250 L444 262 L496 224 L548 238 L600 196 L652 176 L672 168" fill="none" stroke="url(#line)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
