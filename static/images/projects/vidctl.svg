<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">vidctl desktop app preview</title>
  <desc id="desc">Dark desktop video compressor with destination presets, split parts, audio extraction, and live encode metrics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#080d18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6bffd6"/>
      <stop offset=".5" stop-color="#31c9ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx=".15" cy=".08" r=".8">
      <stop offset="0" stop-color="#31c9ff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#31c9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".92" cy=".05" r=".6">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".16"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>
  <rect width="1200" height="750" fill="url(#glow2)"/>

  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif">
    <rect x="48" y="48" width="1104" height="654" rx="20" fill="#0e1522" stroke="#22304a"/>

    <g transform="translate(76, 72)">
      <circle cx="0" cy="0" r="5.5" fill="#ff5f57"/>
      <circle cx="20" cy="0" r="5.5" fill="#febc2e"/>
      <circle cx="40" cy="0" r="5.5" fill="#28c840"/>
    </g>
    <text x="140" y="79" fill="#c9d6e6" font-size="15" font-family="'JetBrains Mono', ui-monospace, monospace">VIDCTL · compressor de vídeo</text>
    <text x="1108" y="79" fill="#7d8ea6" font-size="13" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace">☀ PT EN ES 中文</text>
    <line x1="48" y1="100" x2="1152" y2="100" stroke="#22304a"/>
    <line x1="340" y1="100" x2="340" y2="702" stroke="#22304a"/>

    <g font-family="'JetBrains Mono', ui-monospace, monospace">
      <text x="76" y="132" fill="#7d8ea6" font-size="11" letter-spacing="2">DESTINO</text>
      <rect x="68" y="144" width="248" height="64" rx="10" fill="#111a2b" stroke="#2a3b57"/>
      <text x="84" y="169" fill="#e6edf3" font-size="14">WhatsApp Status</text>
      <text x="84" y="190" fill="#8ea0b8" font-size="12">10 MB · 2-pass</text>
      <text x="300" y="172" fill="#6bffd6" font-size="14" text-anchor="end">✓</text>

      <text x="76" y="242" fill="#7d8ea6" font-size="11" letter-spacing="2">CORTE</text>
      <rect x="68" y="254" width="248" height="64" rx="10" fill="#111a2b" stroke="#2a3b57"/>
      <text x="84" y="279" fill="#e6edf3" font-size="14">6 partes</text>
      <text x="84" y="300" fill="#8ea0b8" font-size="12">~5:00 por parte</text>

      <text x="76" y="352" fill="#7d8ea6" font-size="11" letter-spacing="2">EXTRAIR ÁUDIO</text>
      <rect x="68" y="364" width="248" height="64" rx="10" fill="#111a2b" stroke="#2a3b57"/>
      <text x="84" y="389" fill="#e6edf3" font-size="14">MP3 · 192k</text>
      <text x="84" y="410" fill="#8ea0b8" font-size="12">estéreo · normalizar</text>

      <text x="76" y="462" fill="#7d8ea6" font-size="11" letter-spacing="2">CODEC</text>
      <rect x="68" y="474" width="248" height="64" rx="10" fill="#111a2b" stroke="#2a3b57"/>
      <text x="84" y="499" fill="#e6edf3" font-size="14">H.265 / HEVC</text>
      <text x="84" y="520" fill="#8ea0b8" font-size="12">GPU · NVENC p4</text>
    </g>

    <g font-family="Inter, 'Segoe UI', system-ui, sans-serif">
      <rect x="364" y="124" width="764" height="92" rx="12" fill="#111a2b" stroke="#2a3b57"/>
      <text x="384" y="156" fill="#e6edf3" font-size="18" font-weight="700">palestra-open-source.mp4</text>
      <text x="384" y="181" fill="#8ea0b8" font-size="13" font-family="'JetBrains Mono', ui-monospace, monospace">1920×1080 · 16:9 · 30:00 · 420 MB · h264</text>
      <text x="1108" y="160" fill="#6bffd6" font-size="20" text-anchor="end">✔</text>

      <text x="364" y="250" fill="#8ea0b8" font-size="13" font-family="'JetBrains Mono', ui-monospace, monospace">comprimindo · parte 4/6 · 60%</text>
      <rect x="364" y="262" width="764" height="10" rx="5" fill="#182237"/>
      <rect x="364" y="262" width="458" height="10" rx="5" fill="url(#accent)"/>

      <rect x="364" y="298" width="764" height="116" rx="14" fill="#111a2b" stroke="#2a3b57"/>
      <text x="388" y="368" fill="url(#accent)" font-size="52" font-weight="800" letter-spacing="-2">−86%</text>
      <text x="560" y="340" fill="#e6edf3" font-size="18" font-weight="600">59,4 MB · 6 partes</text>
      <text x="560" y="366" fill="#8ea0b8" font-size="14" font-family="'JetBrains Mono', ui-monospace, monospace">de 420,0 MB · WhatsApp Status</text>
      <text x="560" y="390" fill="#7d8ea6" font-size="13" font-family="'JetBrains Mono', ui-monospace, monospace">H.265 · NVENC p4 · destino 10 MB por parte</text>

      <rect x="364" y="434" width="764" height="82" rx="12" fill="#111a2b" stroke="#2a3b57"/>
      <text x="384" y="466" fill="#e6edf3" font-size="15" font-family="'JetBrains Mono', ui-monospace, monospace">palestra-open-source.mp3</text>
      <text x="384" y="490" fill="#8ea0b8" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace">MP3 · 192k · 33,8 MB · 12s</text>
      <rect x="1000" y="452" width="108" height="32" rx="16" fill="#132c2a" stroke="#2a5a52"/>
      <text x="1054" y="473" fill="#6bffd6" font-size="12" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">abrir pasta</text>

      <rect x="364" y="536" width="764" height="58" rx="12" fill="#0b1320" stroke="#22304a"/>
      <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13">
        <text x="388" y="571" fill="#7d8ea6">CPU</text>
        <text x="426" y="571" fill="#6bffd6">62%</text>
        <text x="500" y="571" fill="#7d8ea6">RAM</text>
        <text x="538" y="571" fill="#31c9ff">41%</text>
        <text x="612" y="571" fill="#7d8ea6">ffmpeg</text>
        <text x="674" y="571" fill="#e6edf3">3.8×</text>
        <text x="750" y="571" fill="#7d8ea6">GPU</text>
        <text x="788" y="571" fill="#a78bfa">NVENC</text>
        <text x="1108" y="571" fill="#7d8ea6" text-anchor="end">⏱ 12s</text>
      </g>

      <rect x="364" y="614" width="764" height="48" rx="24" fill="#111a2b" stroke="#2a3b57"/>
      <text x="746" y="645" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">Comprimir vídeos</text>
      <text x="1108" y="645" fill="#7d8ea6" font-size="12" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace">100% offline</text>
    </g>

    <text x="600" y="732" fill="#61718a" font-size="13" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">Go · Wails · Svelte · ffmpeg — desktop para Linux, Windows e macOS</text>
  </g>
</svg>
